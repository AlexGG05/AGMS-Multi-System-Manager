<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neues Passwort setzen · CodeX</title><link rel="stylesheet" href="/static/legal.css?v=20261015-legal1"><link rel="stylesheet" href="/static/control-center.css"><main class="workspace" style="max-width:560px"><h1>Neues Passwort setzen</h1><form id="form" class="widget" style="display:grid;gap:14px"><label>Neues Passwort (mind. 16 Zeichen)<input id="password" type="password" required minlength="16" maxlength="72"></label><button class="action">Neues Passwort setzen</button><p id="status" role="status"></p><a href="/">Zur Anmeldung</a></form></main><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/account/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:new URLSearchParams(location.search).get('token'),password:document.getElementById('password').value})});const d=await r.json();document.getElementById('status').textContent=r.ok?'Erfolgreich. Bitte bei Bedarf anmelden.':(d.detail||'Fehler')}catch(e){document.getElementById('status').textContent='Verbindung fehlgeschlagen'}};</script><script src="/static/agms-i18n.js?v=20261015-legal1" defer></script></html>
