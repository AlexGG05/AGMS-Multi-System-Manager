<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrieren · AGMS</title><link rel="stylesheet" href="/static/control-center.css"><main class="workspace" style="max-width:560px"><div class="intro"><div><span class="eyebrow">AGMS</span><h2>Konto erstellen</h2><p>Deine eigene Homepage und dein eigenes Team.</p></div></div><form id="signup" class="widget" style="display:grid;gap:16px"><label>E-Mail-Adresse<input required type="email" id="email" autocomplete="email" style="display:block;width:100%;padding:12px;margin-top:8px"></label><label>Passwort (mindestens 16 Zeichen)<input required type="password" id="password" minlength="16" maxlength="128" autocomplete="new-password" style="display:block;width:100%;padding:12px;margin-top:8px"></label><button class="action">Registrieren</button><p id="message" role="alert"></p><a href="/">Bereits registriert? Zum Login</a></form></main><script>document.getElementById('signup').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('message');m.textContent='';try{const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});if(!r.ok){const d=await r.json();throw Error(d.detail||'Registrierung fehlgeschlagen')}document.getElementById('message').textContent='Bitte bestätige deine E-Mail-Adresse über den Link in deinem Postfach.'}catch(e){m.textContent=e.message}};</script></html>
