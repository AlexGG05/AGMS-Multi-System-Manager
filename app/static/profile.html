<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mein Profil · AGMS</title><link rel="stylesheet" href="/static/control-center.css"><style>main{max-width:620px;margin:auto;padding:22px}.profile-form{display:grid;gap:15px}.profile-form label{display:grid;gap:7px}.profile-form input{width:100%;box-sizing:border-box;padding:12px;border-radius:8px}#avatarPreview{width:100px;height:100px;object-fit:cover;border-radius:50%;border:2px solid #526e92}button{cursor:pointer;padding:12px}#notice{min-height:24px}</style></head><body><main><a href="/">← Dashboard</a><h1>Mein Profil</h1><form id="profile" class="widget profile-form"><img id="avatarPreview" alt="Profilbild"><label>Benutzername<input id="displayName" required minlength="3" maxlength="32" autocomplete="nickname"></label><label>Profilbild (PNG, JPG, WebP)<input id="avatarFile" type="file" accept="image/png,image/jpeg,image/webp"></label><button id="removeAvatar" type="button">Profilbild entfernen</button><button type="submit" class="action">Profil speichern</button></form><h2>E-Mail-Adresse ändern</h2><form id="emailForm" class="widget profile-form"><p>Aktuelle E-Mail: <strong id="currentEmail"></strong></p><p id="pending"></p><label>Neue E-Mail-Adresse<input id="newEmail" type="email" required autocomplete="email"></label><label>Aktuelles Passwort zur Bestätigung<input id="password" type="password" required autocomplete="current-password"></label><button class="action">Bestätigungslink senden</button></form><p id="notice" role="status"></p></main><script>
const $=id=>document.getElementById(id);let avatar='';
const csrf=()=>decodeURIComponent((document.cookie.match(/(?:^|; )csrf=([^;]*)/)||[])[1]||'');
async function api(path,method='GET',body){const r=await fetch(path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf()},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'HTTP '+r.status);return d}
function preview(){ $('avatarPreview').src=avatar||'/static/agms-icon.svg'}
async function load(){try{const p=await api('/api/account/profile');$('displayName').value=p.display_name||'';$('currentEmail').textContent=p.email||'Keine E-Mail';$('pending').textContent=p.pending_email?'Bestätigung ausstehend: '+p.pending_email:'';avatar=p.avatar||'';preview()}catch(e){$('notice').textContent=e.message}}
$('avatarFile').onchange=async()=>{const file=$('avatarFile').files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>5000000){$('notice').textContent='Bitte ein PNG, JPG oder WebP unter 5 MB auswählen';return}try{const image=await createImageBitmap(file);const canvas=document.createElement('canvas');const size=256;canvas.width=size;canvas.height=size;const ctx=canvas.getContext('2d');ctx.drawImage(image,0,0,size,size);image.close();avatar=canvas.toDataURL('image/webp',.8);if(avatar.length>220000)throw Error('Profilbild zu groß');preview();$('notice').textContent='Profilbild ausgewählt. Bitte speichern.'}catch(e){$('notice').textContent=e.message}};
$('removeAvatar').onclick=()=>{avatar='';preview()};
$('profile').onsubmit=async e=>{e.preventDefault();try{await api('/api/account/profile','PUT',{display_name:$('displayName').value,avatar});$('notice').textContent='Profil gespeichert'}catch(err){$('notice').textContent=err.message}};
$('emailForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/account/change-email','POST',{email:$('newEmail').value,password:$('password').value});$('notice').textContent=d.message;$('password').value='';await load()}catch(err){$('notice').textContent=err.message}};
load();
</script></body></html>
