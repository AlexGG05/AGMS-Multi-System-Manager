<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passwort vergessen · AGMS</title><link rel="stylesheet" href="/static/legal.css?v=20261015-legal1"><link rel="stylesheet" href="/static/control-center.css"><main class="workspace" style="max-width:560px"><h1>Passwort vergessen</h1><form id="form" class="widget" style="display:grid;gap:14px"><label>E-Mail-Adresse<input id="email" type="email" required></label><button class="action">Passwort vergessen</button><p id="status" role="status"></p><a href="/">Zur Anmeldung</a></form></main><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/account/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value})});const d=await r.json();document.getElementById('status').textContent=r.ok?'Erfolgreich. Bitte bei Bedarf anmelden.':(d.detail||'Fehler')}catch(e){document.getElementById('status').textContent='Verbindung fehlgeschlagen'}};</script><script src="/static/agms-i18n.js?v=20261015-legal1" defer></script></html>
