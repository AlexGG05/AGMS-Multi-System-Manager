<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Einladung · CodeX</title><link rel="stylesheet" href="/static/control-center.css"><main class="workspace" style="max-width:600px"><h1>Team-Einladung</h1><p>Bitte mit der eingeladenen E-Mail-Adresse anmelden oder registrieren.</p><button class="action" id="accept">Einladung annehmen</button><p id="message"></p><a href="/">Zum Login</a></main><script>document.getElementById('accept').onclick=async()=>{const token=new URLSearchParams(location.search).get('token');const csrf=decodeURIComponent((document.cookie.match(/(?:^|; )csrf=([^;]*)/)||[])[1]||'');const r=await fetch('/api/invitations/accept',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({token})});const d=await r.json();document.getElementById('message').textContent=r.ok?'Einladung angenommen. Homepage ist jetzt verfügbar.':(d.detail||'Bitte zuerst anmelden.');if(r.ok)location.assign('/');};</script><script src="/static/agms-i18n.js?v=20261013a" defer></script></html>
