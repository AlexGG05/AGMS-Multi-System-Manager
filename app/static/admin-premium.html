<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodeX · Premium-Verwaltung</title><link rel="stylesheet" href="/static/control-center.css"><main class="workspace"><div class="top"><h1>Benutzer & Premium</h1><a href="/">Zurück</a></div><p>Tier 0: 1 Homepage · Tier 1: 3 · Tier 2: 5 · Tier 3: 10</p><section class="overview" id="accounts"></section><p id="status"></p></main><script>const csrf=()=>decodeURIComponent((document.cookie.match(/(?:^|; )csrf=([^;]*)/)||[])[1]||'');async function load(){const r=await fetch('/api/admin/accounts');if(!r.ok){document.getElementById('status').textContent='Nur für Administratoren';return}const d=await r.json();const root=document.getElementById('accounts');root.replaceChildren();for(const a of d.accounts){const box=document.createElement('article');box.className='widget';const name=document.createElement('h3');name.textContent=a.email||a.username;box.append(name);const role=document.createElement('p');role.textContent=a.role+(a.verified_at?' · Verifiziert':' · Nicht verifiziert');box.append(role);const select=document.createElement('select');for(let i=0;i<=3;i++){const opt=document.createElement('option');opt.value=i;opt.textContent=i?'Premium Tier '+i:'Benutzer (kostenlos)';select.append(opt)}select.value=a.tier;select.disabled=a.role==='admin';select.onchange=async()=>{const res=await fetch('/api/admin/accounts/'+encodeURIComponent(a.username)+'/tier',{method:'PUT',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf()},body:JSON.stringify({tier:Number(select.value)})});document.getElementById('status').textContent=res.ok?'Gespeichert':'Änderung fehlgeschlagen'};box.append(select);root.append(box)}}load();</script></html>
