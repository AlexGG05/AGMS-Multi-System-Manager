<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AGMS · Premium-Verwaltung</title><link rel="stylesheet" href="/static/control-center.css"><main class="workspace"><div class="top"><h1>Benutzer & Premium</h1><a href="/">Zurück</a></div><p>Tier 0: 1 Homepage · Tier 1: 3 · Tier 2: 5 · Tier 3: 10</p><h2 id="proxy-requests">Proxy-Freigaben</h2><p>Neue Proxy-Ziele von Benutzern prüfen und freigeben oder ablehnen.</p><section class="overview" id="proxyRequests"></section><h2>Benutzerkonten</h2><section class="overview" id="accounts"></section><p id="status"></p></main><script>const csrf=()=>decodeURIComponent((document.cookie.match(/(?:^|; )csrf=([^;]*)/)||[])[1]||'');async function load(){const r=await fetch('/api/admin/accounts');if(!r.ok){document.getElementById('status').textContent='Nur für Administratoren';return}const d=await r.json();const root=document.getElementById('accounts');root.replaceChildren();for(const a of d.accounts){const box=document.createElement('article');box.className='widget';const name=document.createElement('h3');name.textContent=a.email||a.username;box.append(name);const role=document.createElement('p');role.textContent=a.role+(a.verified_at?' · Verifiziert':' · Nicht verifiziert');box.append(role);const select=document.createElement('select');for(let i=0;i<=3;i++){const opt=document.createElement('option');opt.value=i;opt.textContent=i?'Premium Tier '+i:'Benutzer (kostenlos)';select.append(opt)}select.value=a.tier;select.disabled=a.role==='admin';select.onchange=async()=>{const res=await fetch('/api/admin/accounts/'+encodeURIComponent(a.username)+'/tier',{method:'PUT',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf()},body:JSON.stringify({tier:Number(select.value)})});document.getElementById('status').textContent=res.ok?'Gespeichert':'Änderung fehlgeschlagen'};box.append(select);if(a.role!=='admin'){const del=document.createElement('button');del.textContent='Benutzer löschen';del.style.marginLeft='12px';del.onclick=async()=>{if(!confirm('Benutzer '+(a.email||a.username)+' und alle eigenen Homepages endgültig löschen?'))return;const res=await fetch('/api/admin/accounts/'+encodeURIComponent(a.username),{method:'DELETE',headers:{'X-CSRF-Token':csrf()}});if(res.ok){document.getElementById('status').textContent='Benutzer gelöscht';await load()}else{document.getElementById('status').textContent='Löschen fehlgeschlagen: '+(await res.text())}};box.append(del)}root.append(box)}}async function loadProxyRequests(){const r=await fetch('/api/admin/proxy-requests');if(!r.ok)return;const d=await r.json();const root=document.getElementById('proxyRequests');root.replaceChildren();for(const req of d.requests){const box=document.createElement('article');box.className='widget';const title=document.createElement('h3');title.textContent=req.origin;const info=document.createElement('p');info.textContent='Angefragt von '+req.requested_by+' · '+req.status;box.append(title,info);if(req.status==='pending'){for(const [decision,label] of [['approved','Freigeben'],['rejected','Ablehnen']]){const btn=document.createElement('button');btn.textContent=label;btn.onclick=async()=>{if(decision==='approved'&&!confirm('Proxy-Ziel '+req.origin+' für alle berechtigten AGMS-Benutzer freigeben?'))return;const res=await fetch('/api/admin/proxy-requests/decision',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf()},body:JSON.stringify({origin:req.origin,decision})});document.getElementById('status').textContent=res.ok?'Entscheidung gespeichert':'Fehler: '+await res.text();if(res.ok)await loadProxyRequests()};box.append(btn)}}root.append(box)}if(!d.requests.length)root.textContent='Keine Proxy-Anfragen vorhanden.'}
load();loadProxyRequests();</script></html>
