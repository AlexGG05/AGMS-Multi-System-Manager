<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodeX Homelab · Anmeldung</title><link rel="stylesheet" href="/static/style.css"></head><body><div id="login" class="center"><form id="loginForm" class="panel login"><div class="brand">⬡ CodeX <span>Homelab</span></div><h1>Willkommen zurück</h1><p>Melde dich an, um deine Homepages zu öffnen.</p><label>E-Mail / Benutzername<input id="username" autocomplete="username" required></label><label>Passwort<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Anmelden →</button><p id="loginError" class="error" role="alert"></p><p><a href="/static/signup.html">Registrieren</a> · <a href="/static/forgot-password.html">Passwort vergessen?</a></p></form></div><script>const form=document.getElementById('loginForm');form.addEventListener('submit',async e=>{e.preventDefault();const error=document.getElementById('loginError');error.textContent='';const button=form.querySelector('button[type=submit]');button.disabled=true;try{const res=await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});if(!res.ok){const body=await res.json().catch(()=>({}));throw Error(body.detail||'Anmeldung fehlgeschlagen')}window.location.replace('/?login='+Date.now())}catch(err){error.textContent=err.message;button.disabled=false}});</script></body></html>
