<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Mail bestätigen · CodeX</title><link rel="stylesheet" href="/static/control-center.css"><main class="workspace" style="max-width:560px"><h1>E-Mail bestätigen</h1><form id="form" class="widget" style="display:grid;gap:14px"><button class="action">E-Mail bestätigen</button><p id="status" role="status"></p><a href="/">Zur Anmeldung</a></form></main><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/account/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:new URLSearchParams(location.search).get('token')})});const d=await r.json();document.getElementById('status').textContent=r.ok?'Erfolgreich. Bitte bei Bedarf anmelden.':(d.detail||'Fehler')}catch(e){document.getElementById('status').textContent='Verbindung fehlgeschlagen'}};</script></html>
