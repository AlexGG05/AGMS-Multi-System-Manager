<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Mail-Wechsel bestätigen · AGMS</title><link rel="stylesheet" href="/static/control-center.css"></head><body><main class="workspace" style="max-width:560px"><h1>Neue E-Mail bestätigen</h1><form id="form" class="widget" style="display:grid;gap:14px"><p>Bestätige die neue E-Mail-Adresse für dein AGMS-Konto.</p><button class="action">E-Mail-Wechsel bestätigen</button><p id="status" role="status"></p><a href="/static/profile.html">Zurück zum Profil</a></form></main><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const el=document.getElementById('status');try{const r=await fetch('/api/account/confirm-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:new URLSearchParams(location.search).get('token')})});const d=await r.json();el.textContent=r.ok?'Neue E-Mail-Adresse bestätigt. Ab sofort damit anmelden.':(d.detail||'Fehler')}catch(e){el.textContent='Verbindung fehlgeschlagen'}};</script><script src="/static/agms-i18n.js?v=20261013a" defer></script></body></html>
