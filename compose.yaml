services:
  dashboard:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      GUACD_HOST: guacd
      GUACD_PORT: "4822"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - dashboard_data:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 1.0
  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /home/guacd:size=16m,uid=1000,gid=1000,mode=700
    mem_limit: 512m
    cpus: 1.0
    # Internal-only gateway; do not publish port 4822.
volumes:
  dashboard_data:
